services:
  self-healing-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: self-healing-cicd-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

