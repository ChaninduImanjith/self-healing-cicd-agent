name: Self-Healing Pipeline Trigger

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
  workflow_dispatch:
    inputs:
      simulated_log:
        description: "Simulated error log to send to Self-Healing Agent"
        required: false
        default: "Step 4/10 : RUN pip install -r requirements.txt\nERROR: Could not find a version that satisfies the requirement wso2-mi-tools==1.0.0\nERROR: No matching distribution found for wso2-mi-tools==1.0.0"

jobs:
  intercept-and-heal:
    name: Intercept Failure and Trigger Auto-Healing
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Extract Build Log
        id: extract_log
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_LOG="${{ github.event.inputs.simulated_log }}"
          else
            echo "Fetching failed workflow run log..."
            RAW_LOG=$(gh run view ${{ github.event.workflow_run.id }} --log-failed 2>&1 | grep -v -E "(Post job cleanup|safe\.directory|extraheader|orphan processes|Node\.js 20 is deprecated|\[command\]/usr/bin/git)" | tail -n 60 || echo "Build failed during step execution.")
          fi
          
          # Encode log safely into JSON file with dynamic repository coordinates
          jq -n \
            --arg build_id "gh-run-${{ github.event.workflow_run.id || github.run_id }}" \
            --arg log_output "$RAW_LOG" \
            --arg repo_owner "${{ github.repository_owner }}" \
            --arg repo_name "${{ github.event.repository.name }}" \
            --arg branch "${{ github.ref_name || 'main' }}" \
            --arg ci_provider "github-actions" \
            '{build_id: $build_id, log_output: $log_output, repo_owner: $repo_owner, repo_name: $repo_name, branch: $branch, ci_provider: $ci_provider}' > payload.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch Webhook to Self-Healing Agent
        run: |
          echo "Dispatching failure payload to Self-Healing CI/CD Agent..."
          WEBHOOK_URL="${{ secrets.HEALING_AGENT_WEBHOOK_URL || 'http://localhost:8000/webhook' }}"
          
          if [ "$WEBHOOK_URL" != "http://localhost:8000/webhook" ]; then
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @payload.json \
              --retry 3 \
              --retry-connrefused \
              --retry-delay 2 \
              --retry-all-errors)
            echo "$RESPONSE"
          else
            echo "Notice: HEALING_AGENT_WEBHOOK_URL secret not set. Payload prepared for agent interception."
            cat payload.json
          fi

